<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de E-mail - MáquinasMax</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

    <header>
        <a href="../../index.html" class="logo">MáquinasMax</a>
        <div style="flex: 1;"></div>
    </header>

    <main style="min-height: calc(100vh - 100px); display: flex; justify-content: center; align-items: center;">
        <div class="card-center">
            <div style="text-align: center; margin-bottom: 30px;">
                <div style="width: 80px; height: 80px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; margin: 0 auto 20px; box-shadow: 0 4px 15px rgba(247, 147, 30, 0.3);">🛡️</div>
                <h2>Verifique seu e-mail</h2>
                <p style="color: #888; margin-top: 10px;">Por segurança, confirme o e-mail cadastrado para ativar sua conta.</p>
            </div>

            <form id="verificacaoForm">
                <div class="input-group">
                    <label>E-mail de Confirmação *</label>
                    <input type="email" id="emailVerif" placeholder="Digite o e-mail novamente" required>
                </div>

                <button type="submit" class="btn-laranja">Enviar Código de Verificação</button>
            </form>

            <div style="margin-top: 20px; text-align: center;">
                <a href="cadastro-credenciais.html" style="font-size: 14px; color: var(--primary); text-decoration: none; font-weight: 600;">← Voltar</a>
            </div>
        </div>
    </main>

    <footer style="position: fixed; bottom: 0; width: 100%; background: white; padding: 15px; text-align: center; border-top: 1px solid #ddd; font-size: 12px;">
        <a href="../../index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">← Voltar ao início</a>
    </footer>

    <script src="../../js/main.js"></script>
    <script>
        document.getElementById('verificacaoForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const emailVerif = document.getElementById('emailVerif').value;
            const emailCadastro = sessionStorage.getItem('cadastro_email');

            if (emailVerif !== emailCadastro) {
                alert('O e-mail não corresponde ao cadastrado!');
                return;
            }

            alert('Código de verificação enviado! (Simulado)');
            window.location.href = 'email-verificado.html';
        });
    </script>
</body>
</html>
