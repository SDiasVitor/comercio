<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Dados Pessoais - MáquinasMax</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }
        .form-grid.full {
            grid-column: 1 / -1;
        }
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="../../index.html" style="margin-right: auto;" class="logo">MáquinasMax</a>
        <span style="flex: 1;"></span>
    </header>

    <main style="display: flex; justify-content: center; align-items: center; padding: 40px 20px; min-height: calc(100vh - 100px);">
        <div class="card-center" style="max-width: 850px;">
            <div style="text-align: center; margin-bottom: 30px;">
                <div style="width: 80px; height: 80px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; margin: 0 auto 20px; box-shadow: 0 4px 15px rgba(247, 147, 30, 0.3);">📝</div>
                <h2>Criar Conta</h2>
                <p style="color: #888; margin-top: 10px;">Preencha suas informações pessoais para continuar o cadastro.</p>
            </div>

            <form id="cadastroForm1">
                <div class="form-grid">
                    <div class="input-group">
                        <label>Nome Completo *</label>
                        <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                    </div>

                    <div class="input-group">
                        <label>CPF *</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="input-group">
                        <label>Cidade *</label>
                        <input type="text" id="cidade" placeholder="Sua cidade" required>
                    </div>

                    <div class="input-group">
                        <label>Estado *</label>
                        <input type="text" id="estado" placeholder="UF" maxlength="2" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="input-group">
                        <label>Telefone</label>
                        <input type="tel" id="telefone" placeholder="(00) 00000-0000">
                    </div>

                    <div class="input-group">
                        <label>CEP *</label>
                        <input type="text" id="cep" placeholder="00000-000" required>
                    </div>
                </div>

                <div class="form-grid full">
                    <div class="input-group">
                        <label>Endereço *</label>
                        <input type="text" id="endereco" placeholder="Rua, Av, Logradouro" required>
                    </div>
                </div>

                <div class="form-grid full">
                    <div class="input-group">
                        <label>Complemento</label>
                        <input type="text" id="complemento" placeholder="Apt, Bloco, etc.">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="input-group">
                        <label>Nº Pessoal *</label>
                        <input type="tel" id="tel_pessoal" placeholder="(00) 00000-0000" required>
                    </div>

                    <div class="input-group">
                        <label>Nº Comercial</label>
                        <input type="tel" id="tel_comercial" placeholder="Opcional">
                    </div>
                </div>

                <button type="submit" class="btn-laranja" style="margin-top: 20px;">Próximo Passo</button>
            </form>

            <div style="margin-top: 25px; text-align: center;">
                <a href="login.html" style="font-size: 14px; color: #888; text-decoration: none; transition: 0.2s;">Já possui uma conta? Faça login</a>
            </div>
        </div>
    </main>

    <footer style="position: fixed; bottom: 0; width: 100%; background: white; padding: 15px; text-align: center; border-top: 1px solid #ddd; font-size: 12px;">
        <a href="../../index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">← Voltar</a>
    </footer>

    <script src="../../js/main.js"></script>
    <script>
        document.getElementById('cadastroForm1').addEventListener('submit', function(e) {
            e.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const cpf = document.getElementById('cpf').value.trim();
            const cidade = document.getElementById('cidade').value.trim();
            const estado = document.getElementById('estado').value.trim();
            const cep = document.getElementById('cep').value.trim();
            const endereco = document.getElementById('endereco').value.trim();
            const tel_pessoal = document.getElementById('tel_pessoal').value.trim();

            if (!nome || !cpf || !cidade || !estado || !cep || !endereco || !tel_pessoal) {
                alert('Preencha todos os campos obrigatórios!');
                return;
            }

            if (!validarCPF(cpf)) {
                alert('CPF inválido!');
                return;
            }

            // Salvar dados em sessionStorage
            sessionStorage.setItem('cadastro_nome', nome);
            sessionStorage.setItem('cadastro_cpf', cpf);
            sessionStorage.setItem('cadastro_cidade', cidade);
            sessionStorage.setItem('cadastro_estado', estado);
            sessionStorage.setItem('cadastro_cep', cep);
            sessionStorage.setItem('cadastro_endereco', endereco);
            sessionStorage.setItem('cadastro_telefone', document.getElementById('telefone').value);
            sessionStorage.setItem('cadastro_complemento', document.getElementById('complemento').value);
            sessionStorage.setItem('cadastro_tel_pessoal', tel_pessoal);
            sessionStorage.setItem('cadastro_tel_comercial', document.getElementById('tel_comercial').value);

            window.location.href = 'cadastro-credenciais.html';
        });

        // Aplicar máscaras
        document.getElementById('cpf').addEventListener('input', e => mascaraCPF(e.target));
        document.getElementById('telefone').addEventListener('input', e => mascaraTelefone(e.target));
        document.getElementById('cep').addEventListener('input', e => mascaraCEP(e.target));
        document.getElementById('tel_pessoal').addEventListener('input', e => mascaraTelefone(e.target));
        document.getElementById('tel_comercial').addEventListener('input', e => mascaraTelefone(e.target));
    </script>
</body>
</html>
