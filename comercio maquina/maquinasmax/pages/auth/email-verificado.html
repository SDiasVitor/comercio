<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-mail Verificado - MáquinasMax</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

    <header>
        <a href="../../index.html" class="logo">MáquinasMax</a>
        <div style="flex: 1;"></div>
    </header>

    <main style="min-height: calc(100vh - 100px); display: flex; justify-content: center; align-items: center;">
        <div class="card-center">
            <div style="text-align: center; margin-bottom: 30px;">
                <div style="width: 80px; height: 80px; background: var(--success); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; margin: 0 auto 20px; box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);">✅</div>
                <h2>E-mail Verificado!</h2>
                <p style="color: #888; margin-top: 10px;">Sua conta foi criada com sucesso. Agora você pode fazer login e começar a usar a plataforma.</p>
            </div>

            <a href="login.html" class="btn-laranja" style="display: block; text-align: center; text-decoration: none; padding: 14px 28px;">Ir para o Login</a>

            <div style="margin-top: 20px; text-align: center;">
                <a href="../../index.html" style="font-size: 14px; color: var(--primary); text-decoration: none; font-weight: 600;">← Explorar Plataforma</a>
            </div>
        </div>
    </main>

    <footer style="position: fixed; bottom: 0; width: 100%; background: white; padding: 15px; text-align: center; border-top: 1px solid #ddd; font-size: 12px;">
        <p style="margin: 0; color: var(--success); font-weight: 600;">✓ Cadastro completo!</p>
    </footer>

    <script src="../../js/main.js"></script>
</body>
</html>
