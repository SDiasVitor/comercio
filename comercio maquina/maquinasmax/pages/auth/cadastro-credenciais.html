<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Credenciais - MáquinasMax</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

    <header>
        <a href="../../index.html" class="logo">MáquinasMax</a>
        <div style="flex: 1;"></div>
    </header>

    <main style="min-height: calc(100vh - 100px); display: flex; justify-content: center; align-items: center;">
        <div class="card-center">
            <div style="text-align: center; margin-bottom: 30px;">
                <div style="width: 80px; height: 80px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; margin: 0 auto 20px; box-shadow: 0 4px 15px rgba(247, 147, 30, 0.3);">🔑</div>
                <h2>Quase lá...</h2>
                <p style="color: #888; margin-top: 10px;">Precisamos de um e-mail válido e uma senha para completar o seu acesso.</p>
            </div>

            <form id="cadastroForm2">
                <div class="input-group">
                    <label>E-mail *</label>
                    <input type="email" id="email" placeholder="Digite seu melhor e-mail" required>
                </div>

                <div class="input-group">
                    <label>Senha *</label>
                    <input type="password" id="senha" placeholder="Crie uma senha (mín. 6 caracteres)" required>
                </div>

                <div class="input-group">
                    <label>Confirmar Senha *</label>
                    <input type="password" id="confirmaSenha" placeholder="Repita a senha" required>
                </div>

                <button type="submit" class="btn-laranja">Concluir Cadastro</button>
            </form>

            <div style="margin-top: 20px; text-align: center;">
                <a href="cadastro.html" style="font-size: 14px; color: var(--primary); text-decoration: none; font-weight: 600;">← Voltar</a>
            </div>
        </div>
    </main>

    <footer style="position: fixed; bottom: 0; width: 100%; background: white; padding: 15px; text-align: center; border-top: 1px solid #ddd; font-size: 12px;">
        <a href="../../index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">← Voltar ao início</a>
    </footer>

    <script src="../../js/main.js"></script>
    <script>
        document.getElementById('cadastroForm2').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const confirmaSenha = document.getElementById('confirmaSenha').value;

            if (!validarEmail(email)) {
                alert('E-mail inválido!');
                return;
            }

            if (!validarSenha(senha)) {
                alert('Senha deve ter no mínimo 6 caracteres!');
                return;
            }

            if (senha !== confirmaSenha) {
                alert('As senhas não conferem!');
                return;
            }

            // Salvar dados em sessionStorage
            sessionStorage.setItem('cadastro_email', email);
            sessionStorage.setItem('cadastro_senha', senha);

            // Simulação: enviar para backend
            const dadosCompletos = {
                nome: sessionStorage.getItem('cadastro_nome'),
                cpf: sessionStorage.getItem('cadastro_cpf'),
                email: email,
                telefone: sessionStorage.getItem('cadastro_telefone'),
                cidade: sessionStorage.getItem('cadastro_cidade'),
                estado: sessionStorage.getItem('cadastro_estado'),
                cep: sessionStorage.getItem('cadastro_cep'),
                endereco: sessionStorage.getItem('cadastro_endereco')
            };

            console.log('Dados do cadastro:', dadosCompletos);

            window.location.href = 'verificar-email.html';
        });
    </script>
</body>
</html>
