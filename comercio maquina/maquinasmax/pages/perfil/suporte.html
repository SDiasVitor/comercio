<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte - MáquinasMax</title>
    <link rel="stylesheet" href="../../css/style.css" />
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="../../index.html" class="logo">MáquinasMax</a>
            <div style="flex: 1;"></div>
            <div class="header-icons">
                <a href="minha-conta.html" title="Perfil" style="color: var(--primary);">👤</a>
            </div>
        </div>
    </header>

    <main style="max-width: 900px; margin: 0 auto; padding: 40px 20px;">
        <a href="minha-conta.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">← Voltar</a>
        <h1>💬 Central de Suporte</h1>

        <div style="background: white; padding: 40px; border-radius: 12px; margin-top: 30px;">
            <h3 style="color: var(--dark); margin-top: 0;">Como podemos ajudar?</h3>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 20px 0;">
                <button style="padding: 20px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer;" onclick="alert('Chat em desenvolvimento!')">💬 Chat</button>
                <button style="padding: 20px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer;" onclick="alert('Email em desenvolvimento!')">📧 Email</button>
                <button style="padding: 20px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer;" onclick="alert('Telefone em desenvolvimento!')">📞 Telefone</button>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2025 MáquinasMax — Compra, Venda e Aluguel de Máquinas Pesadas</p>
    </footer>
</body>
</html>
