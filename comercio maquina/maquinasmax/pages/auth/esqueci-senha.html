<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de Senha - MáquinasMax</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

    <header>
        <a href="../../index.html" class="logo">MáquinasMax</a>
        <div style="flex: 1;"></div>
    </header>

    <main style="min-height: calc(100vh - 100px); display: flex; justify-content: center; align-items: center;">
        <div class="card-center">
            <div style="text-align: center; margin-bottom: 30px;">
                <div style="width: 80px; height: 80px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; margin: 0 auto 20px; box-shadow: 0 4px 15px rgba(247, 147, 30, 0.3);">🔓</div>
                <h2>Esqueceu a Senha?</h2>
                <p style="color: #888; margin-top: 10px;">Digite seu e-mail abaixo. Enviaremos um link para você definir uma nova senha.</p>
            </div>

            <form id="recuperacaoForm">
                <div class="input-group">
                    <label>E-mail da Conta *</label>
                    <input type="email" id="emailRecuperacao" placeholder="exemplo@email.com" required>
                </div>

                <button type="submit" class="btn-laranja">Enviar Link de Recuperação</button>
            </form>

            <div style="margin-top: 20px; text-align: center;">
                <a href="login.html" style="font-size: 14px; color: var(--primary); text-decoration: none; font-weight: 600;">← Voltar para Login</a>
            </div>
        </div>
    </main>

    <footer style="position: fixed; bottom: 0; width: 100%; background: white; padding: 15px; text-align: center; border-top: 1px solid #ddd; font-size: 12px;">
        <a href="../../index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">← Voltar ao início</a>
    </footer>

    <script src="../../js/main.js"></script>
    <script>
        document.getElementById('recuperacaoForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('emailRecuperacao').value;

            if (!validarEmail(email)) {
                alert('E-mail inválido!');
                return;
            }

            sessionStorage.setItem('email_recuperacao', email);
            window.location.href = 'senha-enviada.html';
        });
    </script>
</body>
</html>
