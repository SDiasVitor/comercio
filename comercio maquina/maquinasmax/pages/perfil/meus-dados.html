<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Dados - MáquinasMax</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(247, 147, 30, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn-container button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-salvar {
            background: var(--primary);
            color: white;
        }

        .btn-salvar:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(247, 147, 30, 0.3);
        }

        .btn-cancelar {
            background: #f0f0f0;
            color: var(--dark);
        }

        .btn-cancelar:hover {
            background: #e0e0e0;
        }

        .alerta {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alerta-sucesso {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }

        .alerta-erro {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #f44336;
        }

        .alerta-info {
            background: #e3f2fd;
            color: #1565c0;
            border-left: 4px solid #2196f3;
        }

        @media (max-width: 600px) {
            .form-container {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .btn-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="../../index.html" class="logo">MáquinasMax</a>
            <div style="flex: 1;"></div>
            <div class="header-icons">
                <a href="#" title="Buscar">🔍</a>
                <a href="../checkout/locacoes.html" title="Carrinho">🛒</a>
                <a href="minha-conta.html" title="Voltar ao Perfil" style="color: var(--primary);">👤</a>
            </div>
        </div>
    </header>

    <main style="max-width: 1200px; margin: 0 auto; padding: 40px 20px;">
        
        <div style="margin-bottom: 30px;">
            <a href="minha-conta.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">← Voltar ao Perfil</a>
            <h1 style="margin: 15px 0 0 0;">Editar Meus Dados</h1>
            <p style="color: #888; margin: 5px 0;">Atualize suas informações pessoais</p>
        </div>

        <div class="form-container">
            
            <div id="alerta"></div>

            <form id="formularioDados">
                
                <!-- SEÇÃO 1: INFORMAÇÕES PESSOAIS -->
                <h3 style="color: var(--dark); margin-top: 0; margin-bottom: 20px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; display: inline-block;">👤 Informações Pessoais</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome Completo *</label>
                        <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail *</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="telefone">Telefone *</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(11) 98765-4321" required>
                    </div>
                    <div class="form-group">
                        <label for="cpf">CPF *</label>
                        <input type="text" id="cpf" name="cpf" placeholder="123.456.789-00" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dataNascimento">Data de Nascimento</label>
                        <input type="date" id="dataNascimento" name="dataNascimento">
                    </div>
                    <div class="form-group">
                        <label for="genero">Gênero</label>
                        <select id="genero" name="genero">
                            <option value="">Selecione...</option>
                            <option value="masculino">Masculino</option>
                            <option value="feminino">Feminino</option>
                            <option value="outro">Outro</option>
                            <option value="prefiro_nao_informar">Prefiro não informar</option>
                        </select>
                    </div>
                </div>

                <!-- SEÇÃO 2: PROFISSIONAL -->
                <h3 style="color: var(--dark); margin-top: 30px; margin-bottom: 20px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; display: inline-block;">💼 Informações Profissionais</h3>

                <div class="form-group">
                    <label for="empresa">Empresa</label>
                    <input type="text" id="empresa" name="empresa" placeholder="Nome da sua empresa (opcional)">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cnpj">CNPJ</label>
                        <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00 (opcional)">
                    </div>
                    <div class="form-group">
                        <label for="profissao">Profissão</label>
                        <input type="text" id="profissao" name="profissao" placeholder="Ex: Engenheiro Civil (opcional)">
                    </div>
                </div>

                <!-- SEÇÃO 3: SEGURANÇA -->
                <h3 style="color: var(--dark); margin-top: 30px; margin-bottom: 20px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; display: inline-block;">🔒 Segurança</h3>

                <div class="form-group">
                    <label for="senhaAtual">Senha Atual (para confirmar alterações)</label>
                    <input type="password" id="senhaAtual" name="senhaAtual" placeholder="Digite sua senha atual">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="novaSenha">Nova Senha (deixe em branco para não alterar)</label>
                        <input type="password" id="novaSenha" name="novaSenha" placeholder="Sua nova senha">
                    </div>
                    <div class="form-group">
                        <label for="confirmarSenha">Confirmar Nova Senha</label>
                        <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme sua nova senha">
                    </div>
                </div>

                <!-- BOTÕES -->
                <div class="btn-container">
                    <button type="submit" class="btn-salvar">💾 Salvar Alterações</button>
                    <button type="button" class="btn-cancelar" onclick="voltarPerfil()">✕ Cancelar</button>
                </div>

            </form>

        </div>

    </main>

    <footer>
        <p>© 2025 MáquinasMax — Compra, Venda e Aluguel de Máquinas Pesadas</p>
    </footer>

    <script src="../../js/main.js"></script>
    <script>
        console.log('✓ Página Meus Dados carregada');

        // Carregar dados do usuário
        function carregarDados() {
            const usuarioData = sessionStorage.getItem('usuario_dados');
            
            if (!usuarioData) {
                window.location.href = 'minha-conta.html';
                return;
            }

            const usuario = JSON.parse(usuarioData);

            // Preencher formulário
            document.getElementById('nome').value = usuario.nome || '';
            document.getElementById('email').value = usuario.email || '';
            document.getElementById('telefone').value = usuario.telefone || '';
            document.getElementById('cpf').value = usuario.cpf || '';
            document.getElementById('dataNascimento').value = usuario.dataNascimento || '';
            document.getElementById('genero').value = usuario.genero || '';
            document.getElementById('empresa').value = usuario.empresa || '';
            document.getElementById('cnpj').value = usuario.cnpj || '';
            document.getElementById('profissao').value = usuario.profissao || '';

            console.log('✓ Dados carregados:', usuario);
        }

        // Validar CPF
        function validarCPFFormatado(cpf) {
            cpf = cpf.replace(/\D/g, '');
            return cpf.length === 11;
        }

        // Validar CNPJ
        function validarCNPJFormatado(cnpj) {
            cnpj = cnpj.replace(/\D/g, '');
            return cnpj.length === 14;
        }

        // Mostrar alerta
        function mostrarAlerta(mensagem, tipo = 'info') {
            const alerta = document.getElementById('alerta');
            alerta.className = `alerta alerta-${tipo}`;
            alerta.textContent = mensagem;
            alerta.style.display = 'block';

            if (tipo === 'sucesso') {
                setTimeout(() => {
                    alerta.style.display = 'none';
                }, 3000);
            }
        }

        // Enviar formulário
        document.getElementById('formularioDados').addEventListener('submit', function(e) {
            e.preventDefault();

            // Validações
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            const cpf = document.getElementById('cpf').value.trim();
            const novaSenha = document.getElementById('novaSenha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;

            // Validar campos obrigatórios
            if (!nome || !email || !telefone || !cpf) {
                mostrarAlerta('❌ Preencha todos os campos obrigatórios!', 'erro');
                return;
            }

            // Validar CPF
            if (cpf && !validarCPFFormatado(cpf)) {
                mostrarAlerta('❌ CPF inválido!', 'erro');
                return;
            }

            // Validar CNPJ
            const cnpj = document.getElementById('cnpj').value.trim();
            if (cnpj && !validarCNPJFormatado(cnpj)) {
                mostrarAlerta('❌ CNPJ inválido!', 'erro');
                return;
            }

            // Validar email
            if (!email.includes('@')) {
                mostrarAlerta('❌ Email inválido!', 'erro');
                return;
            }

            // Validar senhas
            if (novaSenha && novaSenha !== confirmarSenha) {
                mostrarAlerta('❌ As senhas não coincidem!', 'erro');
                return;
            }

            // Validar tamanho mínimo da senha
            if (novaSenha && novaSenha.length < 6) {
                mostrarAlerta('❌ A nova senha deve ter no mínimo 6 caracteres!', 'erro');
                return;
            }

            // Montar objeto com dados atualizados
            const usuarioAtualizado = {
                nome: nome,
                email: email,
                telefone: telefone,
                cpf: cpf,
                dataNascimento: document.getElementById('dataNascimento').value,
                genero: document.getElementById('genero').value,
                empresa: document.getElementById('empresa').value,
                cnpj: cnpj,
                profissao: document.getElementById('profissao').value,
                dataRegistro: JSON.parse(sessionStorage.getItem('usuario_dados')).dataRegistro
            };

            // Salvar no sessionStorage
            sessionStorage.setItem('usuario_dados', JSON.stringify(usuarioAtualizado));

            console.log('✓ Dados salvos:', usuarioAtualizado);

            // Feedback
            mostrarAlerta('✅ Dados atualizados com sucesso!', 'sucesso');

            // Redirecionar após 2 segundos
            setTimeout(() => {
                window.location.href = 'minha-conta.html';
            }, 2000);
        });

        // Voltar para perfil
        function voltarPerfil() {
            if (confirm('Descartar alterações?')) {
                window.location.href = 'minha-conta.html';
            }
        }

        // Inicializar
        window.addEventListener('load', carregarDados);

        // Máscaras automáticas
        document.getElementById('telefone').addEventListener('input', function(e) {
            mascaraTelefone(e.target);
        });

        document.getElementById('cpf').addEventListener('input', function(e) {
            mascaraCPF(e.target);
        });
    </script>
</body>
</html>
